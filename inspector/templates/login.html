{% extends 'base.html' %}

{% block content %}
<div class="auth-overlay">
    <div class="auth-card shadow-lg">
        <a href="{% url 'index' %}" class="close-btn text-decoration-none">&times;</a>
        <h4 class="fw-bold mb-1">Welcome to DietaryInspector</h4>
        <p class="text-muted small mb-4">Sign in to save your preferences.</p>
        
        <div class="btn-toggle-group">
            <button class="btn-toggle active">Login</button>
            <a href="{% url 'signup' %}" class="btn-toggle inactive text-decoration-none text-center">Sign Up</a>
        </div>

        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label small fw-bold">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger x-small">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="teal-btn mt-2">Sign In</button>
        </form>

        <div class="text-center my-3 text-muted small">OR</div>
        <a href="{% url 'index' %}" class="guest-btn btn text-center d-block">Continue as Guest</a>
    </div>
</div>
{% endblock %}
