<style>
    .scanner-card {
        background-color: #f0fdfa;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 24px;
        max-width: 800px;
        margin: 20px auto;
        text-align: left;
    }
    .camera-viewport {
        border: 2px dashed #cbd5e1;
        border-radius: 12px;
        height: 350px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
        margin-bottom: 20px;
        overflow: hidden;
        position: relative;
    }
    #webcam-feed {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
    }
    .btn-teal-scanner {
        background-color: #2dd4bf;
        color: white;
        border: none;
        border-radius: 8px;
        width: 100%;
        padding: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
    }
    .btn-teal-scanner:hover { background-color: #14b8a6; }
</style>

<div class="scanner-card shadow-sm">
    <h5 class="fw-bold" style="color: #0d9488;">📷 Ingredient Scanner</h5>
    <p class="small text-muted">Capture a photo of the ingredients list for a real-time safety analysis.</p>

    <div class="camera-viewport" id="viewport-container">
        <div id="placeholder-text" class="text-center">
            <i class="bi bi-camera" style="font-size: 3rem; color: #94a3b8;"></i>
            <p class="text-muted small">Camera closed. Click below to start.</p>
        </div>
        <video id="webcam-feed" autoplay playsinline></video>
    </div>

    <button id="camera-control-btn" class="btn-teal-scanner">
        Open Scanner
    </button>
    
    <div id="scan-feedback" class="mt-3"></div>
</div>

<canvas id="capture-canvas" style="display:none;"></canvas>

<script>
    const videoElem = document.getElementById('webcam-feed');
    const placeholder = document.getElementById('placeholder-text');
    const actionBtn = document.getElementById('camera-control-btn');
    const feedback = document.getElementById('scan-feedback');
    const canvasElem = document.getElementById('capture-canvas');

    let streamInstance = null;

    actionBtn.addEventListener('click', async () => {
        if (!streamInstance) {
            // STEP 1: START CAMERA
            try {
                streamInstance = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                videoElem.srcObject = streamInstance;
                videoElem.style.display = 'block';
                placeholder.style.display = 'none';
                actionBtn.innerText = "Capture & Analyze";
            } catch (err) {
                alert("Camera access failed. Ensure you are on HTTPS.");
            }
        } else {
            // STEP 2: CAPTURE IMAGE
            const ctx = canvasElem.getContext('2d');
            canvasElem.width = videoElem.videoWidth;
            canvasElem.height = videoElem.videoHeight;
            ctx.drawImage(videoElem, 0, 0);
            
            const base64Image = canvasElem.toDataURL('image/jpeg', 0.8);
            
            // STEP 3: SEND TO DJANGO
            actionBtn.disabled = true;
            actionBtn.innerText = "Processing...";
            
            fetch('/scan-api/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ image: base64Image })
            })
            .then(response => response.json())
            .then(data => {
                const badgeColor = data.verdict === 'SAFE' ? 'bg-success' : 'bg-danger';
                feedback.innerHTML = `
                    <div class="card p-3 border-start border-4">
                        <h6>Verdict: <span class="badge ${badgeColor}">${data.verdict}</span></h6>
                        <p class="small mb-0">${data.analysis}</p>
                    </div>
                `;
                stopCamera();
            })
            .catch(error => {
                alert("Error connecting to server.");
                stopCamera();
            });
        }
    });

    function stopCamera() {
        if (streamInstance) {
            streamInstance.getTracks().forEach(track => track.stop());
            streamInstance = null;
        }
        videoElem.style.display = 'none';
        placeholder.style.display = 'block';
        actionBtn.innerText = "Open Scanner";
        actionBtn.disabled = false;
    }
</script>
