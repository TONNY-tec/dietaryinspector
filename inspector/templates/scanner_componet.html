<div class="scanner-container text-center p-4">
    <!-- Camera Preview Area -->
    <div id="cameraWrapper" class="mb-3" style="display:none;">
        <video id="video" width="100%" height="auto" autoplay playsinline class="rounded border"></video>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <!-- Action Buttons -->
    <div class="d-grid gap-2 col-6 mx-auto">
        <button id="startCameraButton" class="btn btn-primary btn-lg">
            <i class="fas fa-camera"></i> Open Scanner
        </button>
        
        <button id="captureButton" class="btn btn-success btn-lg" style="display:none;">
            <i class="fas fa-dot-circle"></i> Capture & Analyze
        </button>

        <!-- New Upload Button -->
        <button id="uploadTrigger" class="btn btn-outline-secondary">
            <i class="fas fa-file-upload"></i> Upload Image
        </button>
        <!-- Hidden File Input -->
        <input type="file" id="fileInput" accept="image/*" style="display:none;">
    </div>

    <!-- Results Display -->
    <div id="scanResult" class="mt-4 p-3 rounded" style="display:none;">
        <h4 id="verdictTitle"></h4>
        <p id="analysisText"></p>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="mt-3" style="display:none;">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p>AI is analyzing ingredients...</p>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const startBtn = document.getElementById('startCameraButton');
    const captureBtn = document.getElementById('captureButton');
    const uploadTrigger = document.getElementById('uploadTrigger');
    const fileInput = document.getElementById('fileInput');
    const loading = document.getElementById('loadingSpinner');
    const resultDiv = document.getElementById('scanResult');

    // 1. Camera Logic
    startBtn.addEventListener('click', async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            document.getElementById('cameraWrapper').style.display = 'block';
            startBtn.style.display = 'none';
            captureBtn.style.display = 'block';
        } catch (err) {
            alert("Camera access denied. Please use the Upload option.");
        }
    });

    captureBtn.addEventListener('click', () => {
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = canvas.toDataURL('image/jpeg');
        sendToApi(imageData);
    });

    // 2. Upload Logic
    uploadTrigger.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            const imageData = event.target.result;
            sendToApi(imageData);
        };
        reader.readAsDataURL(file);
    });

    // 3. Shared API Function
    function sendToApi(base64Image) {
        loading.style.display = 'block';
        resultDiv.style.display = 'none';

        fetch('/scan-api/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken') // Ensure CSRF is handled
            },
            body: JSON.stringify({ image: base64Image })
        })
        .then(response => response.json())
        .then(data => {
            loading.style.display = 'none';
            displayResult(data);
        })
        .catch(error => {
            loading.style.display = 'none';
            alert("Error connecting to server. Check terminal logs.");
        });
    }

    function displayResult(data) {
        resultDiv.style.display = 'block';
        const title = document.getElementById('verdictTitle');
        const text = document.getElementById('analysisText');
        
        title.innerText = data.verdict;
        text.innerText = data.analysis;

        // Color coding based on AI verdict
        resultDiv.className = "mt-4 p-3 rounded " + 
            (data.verdict === 'SAFE' ? 'bg-success text-white' : 
             data.verdict === 'UNSAFE' ? 'bg-danger text-white' : 'bg-warning text-dark');
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
</script>
